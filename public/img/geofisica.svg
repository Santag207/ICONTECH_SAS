<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <rect width="400" height="300" fill="#1d1916"/>
  <!-- Subsurface strata -->
  <path d="M0 110 Q 120 95, 220 115 T 400 100 L 400 300 L 0 300 Z" fill="#3a2819"/>
  <path d="M0 185 Q 160 170, 260 195 T 400 180 L 400 300 L 0 300 Z" fill="#2b1d12"/>
  <!-- Geophones line -->
  <line x1="20" y1="100" x2="380" y2="100" stroke="#b0814f" stroke-width="2" stroke-dasharray="4 4"/>
  <g fill="#c9a57a" stroke="#6b4a2f" stroke-width="1.5">
    <circle cx="50" cy="100" r="6"/>
    <circle cx="120" cy="100" r="6"/>
    <circle cx="190" cy="100" r="6"/>
    <circle cx="260" cy="100" r="6"/>
    <circle cx="330" cy="100" r="6"/>
  </g>
  <!-- Wave propagation animation -->
  <g fill="none" stroke="#22c55e" stroke-width="2">
    <circle cx="50" cy="100" r="15">
      <animate attributeName="r" values="5;160" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="50" cy="100" r="10">
      <animate attributeName="r" values="5;160" dur="2.4s" begin="0.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0" dur="2.4s" begin="0.8s" repeatCount="indefinite"/>
    </circle>
  </g>
  <!-- Oscillogram wave -->
  <path d="M 20 45 L 80 45 L 90 25 L 100 65 L 110 15 L 120 75 L 130 38 L 140 48 L 380 45" fill="none" stroke="#b0814f" stroke-width="2.5"/>
  <text x="20" y="278" font-family="Manrope, sans-serif" font-size="11" font-weight="700" fill="#dfd6cb">Perfil Geofísico MASW / Tomografía Sísmica</text>
</svg>