<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <rect width="400" height="300" fill="#f4f1eb"/>
  <!-- Concrete wall element -->
  <rect x="60" y="40" width="280" height="200" fill="#b0a495" stroke="#3b3530" stroke-width="3" rx="6"/>
  <!-- Rebar grid (Pacometry) -->
  <g stroke="#8b5e3c" stroke-width="4" stroke-dasharray="8 4">
    <line x1="100" y1="50" x2="100" y2="230"/>
    <line x1="160" y1="50" x2="160" y2="230"/>
    <line x1="220" y1="50" x2="220" y2="230"/>
    <line x1="280" y1="50" x2="280" y2="230"/>
    <line x1="70" y1="90" x2="330" y2="90"/>
    <line x1="70" y1="140" x2="330" y2="140"/>
    <line x1="70" y1="190" x2="330" y2="190"/>
  </g>
  <!-- Extracted core cylinder -->
  <circle cx="220" cy="140" r="30" fill="#2b1d12" stroke="#b0814f" stroke-width="3"/>
  <circle cx="220" cy="140" r="30" fill="none" stroke="#6b4a2f" stroke-width="2">
    <animate attributeName="r" values="28;38;28" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="70" y="278" font-family="Manrope, sans-serif" font-size="11" font-weight="700" fill="#6d655d">Inspección Patológica · Núcleos y Pacometría</text>
</svg>